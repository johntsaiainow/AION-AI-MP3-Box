# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-local"
BBFILE_PATTERN_meta-local = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-local = "6"

LAYERDEPENDS_meta-local = "core"
LAYERSERIES_COMPAT_meta-local = "scarthgap"

# AION AI MP3 Box - Google AIY Voice HAT V1
RPI_KERNEL_DEVICETREE_OVERLAYS:append:raspberrypi3-64 = " overlays/googlevoicehat-soundcard.dtbo"

# Disable onboard audio and activate Google Voice HAT
RPI_EXTRA_CONFIG:append:raspberrypi3-64 = "\n# AION Google AIY Voice HAT V1\ndtparam=audio=off\ndtoverlay=googlevoicehat-soundcard\n"

# Disable Raspberry Pi onboard audio; use Google AIY Voice HAT V1
ENABLE_AUDIO:raspberrypi3-64 = "0"
