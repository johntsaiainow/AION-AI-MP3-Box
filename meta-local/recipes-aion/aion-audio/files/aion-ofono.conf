<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="aion-audio">
    <allow send_destination="org.ofono" send_interface="org.ofono.HandsfreeAudioManager"/>
    <allow send_destination="org.ofono" send_interface="org.ofono.HandsfreeAudioCard"/>
  </policy>
</busconfig>
